      description: 重名 400；不存在 404 Device group does not exist。
      operationId: updateDeviceGroup
      tags: [device-group]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGroupUpsertRequest"
      responses:
        "200":
          description: 更新后的设备组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupView"
        "400":
