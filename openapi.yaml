      operationId: listStrategies
      tags: [strategy]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 策略分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
