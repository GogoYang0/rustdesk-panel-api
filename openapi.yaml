      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 策略视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: 更新策略（strategies.edit）
      description: 重名 400；config_options 提供即覆盖。
      operationId: updateStrategy
      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyUpsertRequest"
      responses:
        "200":
          description: 更新后的策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
