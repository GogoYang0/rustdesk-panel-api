openapi: 3.0.3
info:
  title: rustdesk-panel-api
  description: >-
    RustDesk 管理平台后端契约（单一契约源，oapi-codegen design-first）。
    M1 交付 healthz + 认证域 + 用户自身端点共 25 个 operation；
    M2 交付核心业务域 43 个 operation（设备端协议 heartbeat/sysinfo、
    设备/设备组、策略、RBAC、用户组），总计 68 个 operation。
    错误响应统一 NestJS 包络 {statusCode, message, error}，
    message 三种形态并存（业务对象 / 纯文本 / 校验字符串数组）；
    POST 成功一律 200。限流 per-IP per-route（超限 429 ThrottlerException）；
    设备端协议为设备维度限流（tracker=id→uuid→IP）。
    契约基准：参考项目主分支实测（附录 A/B），仅取契约、不搬实现。
  version: 1.1.0-m2
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: auth
  - name: oidc
  - name: user
  - name: device
  - name: device-group
  - name: strategy
  - name: rbac
  - name: user-group
paths:
  /api/healthz:
    get:
      summary: 健康检查
      operationId: healthz
      tags: [system]
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                  time:
                    type: string
                    format: date-time
        default:
          $ref: "#/components/responses/Error"

  /api/login:
    post:
      summary: 登录（type 分支：account / tfa_code / email_code / sms_code）
      description: 限流 5 次/分钟/IP。两步验证（tfa_code 等）返回
        type=email_check + secret（5 分钟、单次使用）。
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录结果（account 直接带 access_token；两步验证带 secret）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: 参数缺失或校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 凭证错误或账号被禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: 限流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/login-options:
    get:
      summary: 登录方式选项（OIDC 提供商列表；参考源码实测为 GET）
      description: 限流 20 次/分钟/IP。返回 ["oidc/{name}"] 或 [{name, icon}]。
      operationId: loginOptions
      tags: [oidc]
      responses:
        "200":
          description: 登录选项数组
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        icon:
                          type: string
        default:
          $ref: "#/components/responses/Error"

  /api/logout:
    post:
      summary: 登出（撤销当前 jti + 设备维度撤销）
      operationId: logout
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: 登出成功（业务 JSON 直返）
          content:
            application/json:
              schema:
                type: object
        "401":
          description: 未认证
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/currentUser:
    post:
      summary: 当前用户信息（payload + tfa_enabled/has_password/verifier）
      operationId: currentUser
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: 用户 payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPayload"
        "401":
          description: 未认证或会话已撤销
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/2fa/setup:
    post:
      summary: 生成 TOTP 密钥（pending secret 存 users.info.other.tfa_pending_secret）
      operationId: setupTfa
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: TOTP secret 与 otpauth URL
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url]
                properties:
                  secret:
                    type: string
                  otpauth_url:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/2fa/verify:
    post:
      summary: 校验并绑定 TOTP（校验通过后落 users.tfaSecret）
      operationId: verifyTfa
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tfaCode]
              properties:
                tfaCode:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: 绑定结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/2fa:
    delete:
      summary: 关闭 2FA（需携带当前验证码）
      operationId: disableTfa
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tfaCode]
              properties:
                tfaCode:
                  type: string
      responses:
        "200":
          description: 关闭结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/passkey/register/begin:
    post:
      summary: 开始 Passkey 注册（返回 PublicKeyCredentialCreationOptionsJSON）
      operationId: passkeyRegisterBegin
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: WebAuthn 创建选项
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/passkey/register/verify:
    post:
      summary: 完成 Passkey 注册（挑战存 login_sessions method=passkey_reg）
      operationId: passkeyRegisterVerify
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: object
                name:
                  type: string
      responses:
        "200":
          description: 注册结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/passkey/auth/begin:
    post:
      summary: 开始 Passkey 免密登录（返回 {secret, options}）
      description: 限流 10 次/分钟/IP；挑战存 login_sessions(method=passkey)。
      operationId: passkeyAuthBegin
      tags: [auth]
      responses:
        "200":
          description: 会话 secret 与请求选项
          content:
            application/json:
              schema:
                type: object
                required: [secret, options]
                properties:
                  secret:
                    type: string
                  options:
                    type: object
        default:
          $ref: "#/components/responses/Error"

  /api/passkey/auth/verify:
    post:
      summary: 完成 Passkey 免密登录
      description: 限流 10 次/分钟/IP。request：{secret, response, id?, uuid?, deviceInfo?}。
      operationId: passkeyAuthVerify
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, response]
              properties:
                secret:
                  type: string
                response:
                  type: object
                id:
                  type: string
                uuid:
                  type: string
                deviceInfo:
                  $ref: "#/components/schemas/DeviceInfo"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/passkey/list:
    get:
      summary: 当前用户 Passkey 凭据列表
      operationId: passkeyList
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: 凭据数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/passkey/{guid}:
    delete:
      summary: 删除 Passkey 凭据
      operationId: deletePasskey
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/passkey/tfa:
    post:
      summary: Passkey 作为二次验证开关（写 users.info.other.passkey_tfa_enabled）
      operationId: passkeyTfaToggle
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: 开关结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/sessions:
    get:
      summary: 当前用户活跃会话列表
      operationId: listSessions
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: SessionInfo 数组（createdAt 倒序）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/sessions/{jti}:
    delete:
      summary: 按 jti 撤销会话（撤销后该 token 立即 401）
      operationId: revokeSession
      tags: [auth]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: jti
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 撤销结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/oidc/auth:
    post:
      summary: 发起 OIDC 授权（返回授权 URL，建 oidc_auth_states，PKCE）
      description: 限流 5 次/分钟/IP。
      operationId: oidcAuth
      tags: [oidc]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcAuthRequest"
      responses:
        "200":
          description: 授权跳转 URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/oidc/auth-query:
    get:
      summary: "客户端轮询授权结果（query: code/id/uuid）"
      description: 限流 120 次/分钟/IP。
      operationId: oidcAuthQuery
      tags: [oidc]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: string
        - name: uuid
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "轮询结果（status: pending | success | error）"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [pending, success, error]
                  token:
                    type: string
                  message:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /api/oidc/callback:
    get:
      summary: OIDC 提供商回调（HTML 页，客户端按 rememberMe 存储 token 后跳转）
      operationId: oidcCallback
      tags: [oidc]
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 回调 HTML 页面
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /api/users/me:
    patch:
      summary: 更新当前用户资料（display_name / email / note）
      operationId: updateMe
      tags: [user]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 更新后的用户 payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/users/me/password:
    patch:
      summary: 修改当前用户密码（bcrypt 复核旧密码）
      description: 限流 5 次/分钟/IP。new_password 至少 6 位。
      operationId: changeMyPassword
      tags: [user]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: 修改结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/users/me/avatar:
    post:
      summary: 上传头像（multipart 字段 avatar，仅 webp，≤2MB，文件名={guid}.webp）
      description: 限流 10 次/分钟/IP。
      operationId: uploadMyAvatar
      tags: [user]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: 删除头像
      description: 限流 10 次/分钟/IP。
      operationId: deleteMyAvatar
      tags: [user]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/avatars/{filename}:
    get:
      summary: "静态头像（仅 ^[a-f0-9-]+\\.webp$，Cache-Control: public, max-age=86400）"
      description: 限流 60 次/分钟/IP；resolve 防路径穿越。
      operationId: getAvatar
      tags: [user]
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-f0-9-]+\\.webp$"
      responses:
        "200":
          description: webp 图片
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  # ==================== M2 设备端协议（公开端点 + 设备维度限流） ====================
  /api/heartbeat:
    post:
      summary: 设备心跳上报（无鉴权；设备维度限流 10 次/分钟，tracker=id→uuid→IP）
      description: >-
        未知设备自动注册（首跳 INSERT ON CONFLICT UPDATE）。响应条件键：
        有 pending 断连时含 disconnect；解析出策略且 strategy.updatedAt(毫秒)
        严格大于报文 modified_at 时含 strategy.config_options 与新 modified_at；
        均未命中时为 {}。未知字段 400（forbidNonWhitelisted 语义）。
      operationId: heartbeat
      tags: [device]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          description: 心跳确认（条件键响应，可为空对象）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: 设备维度限流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /api/sysinfo:
    post:
      summary: 设备系统信息上报（无鉴权；设备维度限流 5 次/分钟，tracker=id→uuid→IP）
      description: >-
        按 uuid 查 peers，不存在直接返回 ID_NOT_FOUND（不自动注册）；存在则
        upsert sysinfos（核心字段"提供即覆盖"、preset 列"非空真值才覆盖"），
        并处理 preset-device-group-name 关联与 preset-note 兜底写入；
        preset-address-book-* 字段接受但不处理（M3 通讯录联动）。
        响应恒为 text/plain 且 HTTP 200。
      operationId: sysinfo
      tags: [device]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SysinfoRequest"
      responses:
        "200":
          description: "SYSINFO_UPDATED（设备已注册并更新）或 ID_NOT_FOUND（设备未注册）"
          content:
            text/plain:
              schema:
                type: string
                enum: [SYSINFO_UPDATED, ID_NOT_FOUND]
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: 设备维度限流
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  # ==================== M2 设备域（peers 同表两视图） ====================
  /api/peers:
    get:
      summary: 可见设备列表（无权限码，JWT + 状态复核；三源可见性过滤）
      description: >-
        非管理员可见 = 自己名下设备 ∪ device_group_user_permissions 授权组内设备
        ∪ user_user_permissions 被授权用户的设备；管理员全量。
        过滤语义：id/user_name/device_group_name/os 均 LIKE（os 查 sysinfos），
        device_group_guid 精确；排序 peer.id ASC（字符串序）。
      operationId: listPeers
      tags: [device]
      parameters:
        - name: accessible
          in: query
          required: false
          description: 兼容字段，忽略
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - name: is_online
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - name: user_name
          in: query
          required: false
          schema:
            type: string
        - name: device_group_guid
          in: query
          required: false
          schema:
            type: string
        - name: device_group_name
          in: query
          required: false
          description: LIKE 匹配（与 /devices 的精确匹配不同）
          schema:
            type: string
        - name: os
          in: query
          required: false
          description: LIKE 匹配 sysinfos.os
          schema:
            type: string
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 可见设备分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/devices:
    get:
      summary: 管理设备列表（devices.view；RBAC scope 边界）
      description: >-
        scoped 操作者排除未分组设备。过滤语义差异（与 /peers 相比）：
        device_group_name 精确匹配；id/user_name/os 精确；
        device_name LIKE sysinfos.hostname；device_username LIKE sysinfos.username；
        group_name LIKE 设备组名；排序 peer.id ASC。
      operationId: listDevices
      tags: [device]
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - name: is_online
          in: query
          required: false
          schema:
            type: string
            enum: ["0", "1"]
        - name: device_name
          in: query
          required: false
          description: LIKE 匹配 sysinfos.hostname
          schema:
            type: string
        - name: user_name
          in: query
          required: false
          schema:
            type: string
        - name: device_username
          in: query
          required: false
          description: LIKE 匹配 sysinfos.username
          schema:
            type: string
        - name: os
          in: query
          required: false
          schema:
            type: string
        - name: device_group_name
          in: query
          required: false
          description: 精确匹配（与 /peers 的 LIKE 不同）
          schema:
            type: string
        - name: device_group_guid
          in: query
          required: false
          schema:
            type: string
        - name: group_name
          in: query
          required: false
          description: LIKE 匹配设备组名
          schema:
            type: string
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: scope 边界内设备分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/devices/status:
    patch:
      summary: 批量启停设备（devices.status；body guids 为 peer.uuid 数组）
      description: >-
        status 为 'enabled' | 'disabled'（DB peers.status 1=正常/0=停用）。
        逐个经 AssertDevicesAccess 复核，任一越权整体 403。
      operationId: updateDeviceStatus
      tags: [device]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStatusUpdateRequest"
      responses:
        "200":
          description: 批量结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatusUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/devices/{guid}:
    patch:
      summary: 更新设备（devices.edit；guid = peer.uuid）
      description: >-
        关联字段（userName/deviceGroupName/strategyName，按名称匹配）变更需
        super administrator；空串表示解绑；note 任意 devices.edit 操作者可改。
      operationId: updateDevice
      tags: [device]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
