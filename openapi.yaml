      name: current
      in: query
      required: false
      description: 页码（1~100000，默认 1；camelCase 契约，禁止规范化）
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: 每页条数（1~100，默认 20；camelCase 契约，禁止规范化）
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:
    DeviceInfo:
      type: object
      properties:
        os:
          type: string
        type:
          type: string
        name:
          type: string

    LoginRequest:
      type: object
      description: type 分支请求；account 需 username/password，
        tfa_code 需 secret+tfaCode，email_code 需 secret+verificationCode。
      properties:
        type:
          type: string
          enum: [account, tfa_code, email_code, sms_code]
          default: account
        username:
          type: string
        password:
          type: string
        tfaCode:
          type: string
        secret:
          type: string
        verificationCode:
          type: string
        autoLogin:
          type: boolean
        id:
          type: string
          description: 设备 ID
        uuid:
          type: string
          description: 设备 UUID
        deviceInfo:
          $ref: "#/components/schemas/DeviceInfo"

    UserPayload:
      type: object
      description: 用户响应 payload（snake_case 契约，禁止规范化）。
      required: [guid, name, is_admin]
      properties:
        guid:
          type: string
        name:
          type: string
        display_name:
          type: string
        email:
          type: string
        note:
          type: string
        is_admin:
          type: boolean
        tfa_enabled:
          type: boolean
        has_password:
          type: boolean
        verifier:
          type: string
        third_auth_type:
          type: string
        avatar:
          type: string
        user_group_guid:
          type: string
        strategy_guid:
          type: string

    LoginResponse:
      type: object
      description: 分支结构：成功登录返回 type=access_token（兼容官方 RustDesk 客户端，
        客户端以 type==access_token 且 access_token 非空作为登录完成条件），
        并带 access_token+user；
        两步验证带 type=email_check + tfa_type + secret；
        passkey_tfa 第一步复用 email_check 类型位并附 passkey_options。
      required: [type]
      properties:
        type:
          type: string
          # account 为弃用的历史值（v0.1.0 及更早版本成功登录返回该值），
          # 仅供过渡期兼容旧客户端识别，新实现一律返回 access_token。
          enum: [access_token, account, email_check]
        access_token:
          type: string
        user:
          $ref: "#/components/schemas/UserPayload"
        tfa_type:
          type: string
          enum: [tfa_check, passkey_check]
        secret:
          type: string
        passkey_options:
          type: object

    LogoutRequest:
      type: object
      properties:
        id:
          type: string
        uuid:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    SessionInfo:
      type: object
      required: [jti, createdAt, expiresAt]
      properties:
        jti:
          type: string
        deviceId:
          type: string
        deviceUuid:
          type: string
        deviceOs:
          type: string
        deviceType:
          type: string
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    PasskeyView:
      type: object
      required: [guid]
      properties:
        guid:
          type: string
        name:
          type: string
        deviceType:
          type: string
        backedUp:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OidcAuthRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
        deviceId:
          type: string
        deviceUuid:
          type: string
        deviceInfo:
          $ref: "#/components/schemas/DeviceInfo"
        frontendRedirectUrl:
          type: string

    UpdateMeRequest:
      type: object
      description: user 域请求字段为 snake_case（契约，禁止规范化）。
      properties:
        display_name:
          type: string
        email:
          type: string
          format: email
        note:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 6

    AvatarResponse:
      type: object
      required: [avatar]
      properties:
        avatar:
          type: string

    # ==================== M2 schemas ====================
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [id, uuid, ver, modified_at]
      properties:
        id:
          type: string
          description: RustDesk 数字设备 ID（如 "123456789"）
        uuid:
          type: string
          description: 设备 UUID（peers 主键）
        ver:
          type: integer
          description: 客户端整版本号（格式化规则见 info.version）
        modified_at:
          type: integer
          format: int64
          description: 客户端策略版本戳（毫秒 epoch）
        conns:
          type: array
          items:
            type: integer
          description: 当前活跃连接 ID；键缺失 ≠ 空（指针判空区分）

    HeartbeatResponse:
      type: object
      additionalProperties: false
      properties:
        disconnect:
          type: array
          items:
            type: integer
          description: 待断连 connId 列表（客户端确认语义）
        strategy:
          type: object
          required: [config_options]
          properties:
            config_options:
              type: object
              additionalProperties:
                type: string
        modified_at:
          type: integer
          format: int64
          description: 下发用策略 updatedAt（毫秒）

    SysinfoRequest:
      type: object
      additionalProperties: false
      required: [uuid]
      properties:
        uuid:
          type: string
        id:
          type: string
        hostname:
          type: string
        username:
          type: string
        os:
          type: string
        cpu:
          type: string
        memory:
          type: string
        version:
          type: string
        preset-address-book-name:
          type: string
          description: M2 接受不处理（M3 通讯录联动）
        preset-address-book-tag:
          type: string
        preset-address-book-alias:
          type: string
        preset-address-book-password:
          type: string
        preset-address-book-note:
          type: string
        preset-username:
          type: string
          description: 非空真值才覆盖 sysinfos.preset_username
        preset-strategy-name:
          type: string
        preset-device-group-name:
          type: string
          description: 按名关联 device_groups 并回写 peers.deviceGroupGuid
        preset-note:
          type: string
          description: 仅当 peers.note 为空时写入

    PeerInfo:
      type: object
      required: [device_name, username, os, version, cpu, memory, ip]
      properties:
        device_name:
          type: string
          description: sysinfos.hostname
        username:
          type: string
          description: sysinfos.username
        os:
          type: string
        version:
          type: string
          description: ver 格式化结果（ver=0 → 空串）
        cpu:
          type: string
        memory:
          type: string
        ip:
          type: string
          description: 恒为空串

    PeerView:
      type: object
      required: [id, guid, status, is_online, last_online, user, user_name, note, device_group_name, strategy_name, info]
      properties:
        id:
          type: string
          description: peer.id（数字设备 ID 字符串）
        guid:
          type: string
          description: = peer.uuid
        status:
          type: integer
          description: 1=正常 / 0=停用
        is_online:
          type: boolean
          description: lastHeartbeat > now-60s（60 秒阈值硬编码）
        last_online:
          type: string
          format: date-time
          nullable: true
        user:
          type: string
          description: = userGuid 或空串
        user_name:
          type: string
        note:
          type: string
        device_group_name:
          type: string
        strategy_name:
          type: string
        info:
          $ref: "#/components/schemas/PeerInfo"

    DeviceView:
      allOf:
        - $ref: "#/components/schemas/PeerView"
        - type: object
          required: [userGuid, deviceGroupGuid]
          properties:
            userGuid:
              type: string
              nullable: true
            deviceGroupGuid:
              type: string
              nullable: true

    PeerPage:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PeerView"
        total:
          type: integer

    DevicePage:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceView"
        total:
          type: integer

    DeviceStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [guids, status]
      properties:
        guids:
          type: array
          items:
            type: string
          minItems: 1
