          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: 更新后的设备视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: 删除设备（devices.delete；guid = peer.uuid）
      description: 服务层事务显式级联删除 active_connections。
      operationId: deleteDevice
      tags: [device]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除成功（空对象）
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/devices/{uuid}/disconnect:
    post:
      summary: 断开设备连接（devices.disconnect；入队内存断连队列）
      description: >-
        校验设备存在（404）与 scope（403）后，将 connIds 加入断连队列，
        客户端下一次心跳收到 disconnect 键。响应 pending_disconnect_count
        为当前 pending 总数。
