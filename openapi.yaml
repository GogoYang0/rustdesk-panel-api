          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGroupTargetPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/device-groups/{guid}:
    patch:
