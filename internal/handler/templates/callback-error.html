<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #f4f6f8; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; padding: 40px 48px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .08); text-align: center; max-width: 420px; }
    h1 { font-size: 22px; margin: 0 0 12px; color: #cf222e; }
    p { color: #57606a; margin: 0 0 8px; font-size: 14px; word-break: break-word; }
    a { color: #0969da; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>&#10060; {{.Title}}</h1>
    <p>{{.Message}}</p>
    <p>Please close this page and try again from the application.</p>
  </div>
</body>
</html>
