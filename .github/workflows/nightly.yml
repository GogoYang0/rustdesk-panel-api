name: Nightly

on:
  schedule:
    - cron: "20 18 * * *" # 每日 UTC 18:20（北京时间次日 02:20）
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=0.0.0-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: sha256sums
        working-directory: out
        run: |
          rm -f SHA256SUMS.txt
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - name: publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly out/* \
            --prerelease \
            --title "Nightly ${{ needs.prepare.outputs.version }}" \
            --notes "自动夜间构建（非稳定版本），全平台静态产物，保留最近 7 份。" \
            --target main

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: "ghcr.io/${{ github.repository }}:nightly"

  # 说明：DockerHub 推送任务待提供 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后补充
  # （计划书 Q5 决议：编写 docker push 相关配置前先向项目所有者确认）。
