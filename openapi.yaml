    Error:
      type: object
      description: NestJS 默认错误包络；message 为对象/字符串/字符串数组三种形态之一。
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
        error:
          type: string

  responses:
    BadRequest:
      description: 参数或校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证或会话已撤销
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
