      summary: 指派策略（strategies.assign；直写宿主表 FK）
      description: >-
        assign 语义 = 直接回写 peers/users/device_groups 的 strategyGuid 列。
        target_type=user 必须 global scope；保护账号目标需 super administrator。
        响应 {success:[], errors:[{target_guid, reason}]}；
        reason：Device not found / User does not exist / Device group not found。
      operationId: assignStrategy
      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
