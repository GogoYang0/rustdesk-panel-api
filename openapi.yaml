          type: string
          nullable: true
          description: 关联变更需 super administrator；空串解绑
        deviceGroupName:
          type: string
          nullable: true
          description: 关联变更需 super administrator；空串解绑
        strategyName:
          type: string
          nullable: true
          description: 关联变更需 super administrator；空串解绑

    DisconnectRequest:
