    ServerBansDto:
      type: object
      description: 封禁名单（device_ids ≤10000；ips 标准 IP 格式）。
      required: [device_ids, ips]
      properties:
        device_ids:
          type: array
          maxItems: 10000
          items:
            type: string
        ips:
          type: array
          items:
            type: string
            format: ipv4

    NexusBindStatus:
      type: object
      description: nexus 绑定态（nexus_tokens 行）。
      required: [bound]
      properties:
        bound:
          type: boolean
        nexus_username:
          type: string
        current_uuid:
          type: string
        expires_at:
          type: string
          format: date-time

    NexusGenerateDto:
      type: object
      description: 构建参数（os 仅 windows；custom 键校验归上游）。
      required: [os, arch, custom]
      properties:
        os:
          type: string
          enum: [windows]
        arch:
          type: string
          enum: [x86_64, aarch64, x86]
        custom:
          type: object
          description: >-
            app-name/password/salt/conn-type/disable-*(Y|N)/override-settings/
            default-settings。
          additionalProperties:
            type: string

    NexusBuildView:
      type: object
      description: 构建任务视图（pending→building→completed|failed|cancelled）。
      required: [uuid, os, arch, status]
      properties:
        uuid:
          type: string
        os:
          type: string
        arch:
          type: string
        custom:
          type: string
          description: JSON 串
        status:
          type: string
          enum: [pending, building, completed, failed, cancelled]
        message:
          type: string
        created_at:
          type: string
          format: date-time

    BuildFiles:
      type: object
      description: 构建产物清单（files JSON 落库形态展开）。
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            required: [filename]
            properties:
              filename:
                type: string
              size:
                type: integer

    FrontendSettings:
      type: object
      description: 前端公开设置（Public）。
      required: [watermarkEnabled, defaultLanguage, webauthnEnabled]
      properties:
        watermarkEnabled:
          type: boolean
        defaultLanguage:
          type: string
        webauthnEnabled:
          type: boolean

    GeneralSettings:
      type: object
      description: 通用设置嵌套 DTO（无 siteFrontendUrl 时 effectiveFrontendUrl 回退 localhost:3000）。
      required: [watermarkEnabled, defaultLanguage, jwtExpiryDays, auditRetentionDays, site, webauthn]
      properties:
        watermarkEnabled:
          type: boolean
        defaultLanguage:
          type: string
        jwtExpiryDays:
          type: integer
        auditRetentionDays:
          type: integer
        site:
          type: object
          required: [frontendUrl, backendUrl]
          properties:
            frontendUrl:
              type: string
            backendUrl:
              type: string
        webauthn:
          type: object
          required: [enabled, rpName]
          properties:
            enabled:
              type: boolean
            rpName:
              type: string

    UpdateGeneralSettings:
      type: object
      description: >-
        更新通用设置（watermarkEnabled 必填；defaultLanguage 匹配 ^[a-z]{2}-[A-Z]{2}$；
        jwtExpiryDays≥1；auditRetentionDays≥0）。
      required: [watermarkEnabled]
      properties:
        watermarkEnabled:
          type: boolean
        defaultLanguage:
          type: string
          pattern: '^[a-z]{2}-[A-Z]{2}$'
        jwtExpiryDays:
          type: integer
          minimum: 1
        auditRetentionDays:
          type: integer
          minimum: 0
        siteFrontendUrl:
          type: string
        siteBackendUrl:
          type: string
        webauthnEnabled:
          type: boolean
        webauthnRpName:
          type: string

    SmtpConfig:
      type: object
      description: >-
        SMTP 配置（pass 回读恒 '******'，PUT 命中掩码跳过更新；
        无配置时 GET 404 SMTP configuration does not exist）。
      properties:
        host:
          type: string
        port:
          type: integer
        secure:
          type: boolean
        user:
          type: string
        pass:
          type: string
        from:
          type: string
        enabled:
          type: boolean

    SettingsTestResult:
      type: object
      description: 连通性测试恒 200（连接失败也是 success:false）。
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        endpoints:
          type: object
          description: oidc test discovery 端点

    LdapConfig:
      type: object
      description: >-
        LDAP 配置（bindCredentials 回读掩码 '******'、PUT 命中掩码跳过；
        test 语义同 smtp 恒 200）。
      properties:
        urls:
          type: array
          items:
            type: string
        bindDN:
          type: string
        bindCredentials:
          type: string
        searchBase:
          type: string
        searchFilter:
          type: string
        searchAttributes:
          type: array
          items:
            type: string
        groupSearchBase:
          type: string
        groupSearchFilter:
          type: string
        adminGroups:
          type: array
          items:
            type: string
        tlsOptions:
          type: object
          properties:
            ca:
              type: string
            cert:
              type: string
            key:
              type: string
            servername:
              type: string
        enabled:
          type: boolean

    OidcProviderDto:
      type: object
      description: OIDC 提供者（clientSecret 明文可见——admin 可见，参考即如此）。
      required: [guid, name, type, issuer, clientId, clientSecret, scope, enabled, priority]
      properties:
        guid:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [oidc, oauth2]
        issuer:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
        scope:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        createdAt:
          type: string
          format: date-time

    OidcProviderPage:
      type: object
      description: 提供者分页（排序 priority ASC + name ASC）。
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OidcProviderDto"
        total:
          type: integer

    OidcProviderUpsert:
      type: object
      description: 创建（POST=200；type 缺省 oidc、scope 按 type 缺省、enabled 缺省 true；重名 400）。
      required: [name, issuer, clientId, clientSecret]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [oidc, oauth2]
        issuer:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
        scope:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer

    UpdateCheckResult:
      type: object
      description: 更新检查（内存缓存 + frontend_version 仅影响 frontend 分支比对）。
      required: [backend, frontend]
      properties:
        backend:
          type: object
          required: [current, latest, hasUpdate]
          properties:
            current:
              type: string
            latest:
              type: string
            hasUpdate:
              type: boolean
            downloadUrl:
              type: string
        frontend:
          type: object
          required: [current, latest, hasUpdate]
          properties:
            current:
              type: string
            latest:
              type: string
            hasUpdate:
              type: boolean
            downloadUrl:
              type: string
        install_id:
          type: string

    Error:
      type: object
      description: NestJS 默认错误包络；message 为对象/字符串/字符串数组三种形态之一。
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
            - type: object
        error:
          type: string

  responses:
    BadRequest:
      description: 参数或校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证或会话已撤销
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: 错误包络
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 权限不足（RBAC scope / AdminGuard / super administrator）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 名称冲突（角色/用户组 409；设备组/策略为 400）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
