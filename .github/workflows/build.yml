name: build

# 可复用的跨平台静态构建流水线（CGO_ENABLED=0），
# 被 nightly.yml / release.yml 以 workflow_call 调用。
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/rustdesk-panel-api ./cmd/api
      - name: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARCH="${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then ARCH="${ARCH}v${{ matrix.goarm }}"; fi
          NAME="rustdesk-panel-api_${VERSION}_${{ matrix.goos }}_${ARCH}"
          mkdir -p "pack/${NAME}" out
          cp dist/rustdesk-panel-api "pack/${NAME}/"
          cp README.md "pack/${NAME}/"
          if [ -f LICENSE ]; then cp LICENSE "pack/${NAME}/"; fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv "pack/${NAME}/rustdesk-panel-api" "pack/${NAME}/rustdesk-panel-api.exe"
            (cd pack && zip -qr "../out/${NAME}.zip" "${NAME}")
          else
            tar -czf "out/${NAME}.tar.gz" -C pack "${NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: out/*
          retention-days: 14
