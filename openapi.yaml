      description: 35+ 码编译期目录序列化，杜绝漂移；roles.create/edit/delete
        为 system_only（assignable=false）。
      operationId: listPermissions
      tags: [rbac]
      responses:
        "200":
          description: 权限目录
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/permissions/me:
    get:
      summary: 当前用户生效权限（JWT；{permissions, scopes} 无 total）
      description: >-
        生效码经依赖过滤；scopes 形态：
        {global: [code...], device_group: {<guid>: [code...]}}。
      operationId: myPermissions
      tags: [rbac]
      responses:
        "200":
          description: 生效权限与 scope 映射
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectivePermissions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

  /api/roles:
    get:
      summary: 角色列表（roles.view）
      description: name/note LIKE 过滤；name ASC、guid ASC 决胜排序。
      operationId: listRoles
      tags: [rbac]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: note
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 角色分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: 创建角色（super administrator）
      description: >-
        重名 409（Role name already exists）；system_only 码写入 400
        （Permission code cannot be assigned: ...）；requires 依赖缺失 400
        （Missing permission dependencies: ...）；事务内显式审计。
      operationId: createRole
      tags: [rbac]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleCreateRequest"
      responses:
        "200":
          description: 创建后的角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/roles/{guid}:
    get:
      summary: 角色详情（roles.view；guid 需 uuid v4，否则 400）
      description: 含权限码清单。
      operationId: getRole
      tags: [rbac]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 角色详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: 更新角色（super administrator）
      description: >-
        重名 409；取消保护（protected_account true→false）需
        confirm_protected_account_change=true，否则 400；
        system_only/requires 校验同创建；事务内显式审计。
      operationId: updateRole
      tags: [rbac]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdateRequest"
      responses:
        "200":
          description: 更新后的角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: 删除角色（super administrator）
      description: >-
        事务级联删 role_permissions/user_role_assignments/
        user_role_assignment_device_groups；删除前 beforeState 全量快照审计。
      operationId: deleteRole
      tags: [rbac]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 删除成功（空对象）
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/roles/{guid}/protection-impact:
    get:
      summary: 保护角色变更影响面（super administrator；{affected_member_count} 无 total）
      description: 统计挂在该角色上的用户数。
      operationId: roleProtectionImpact
      tags: [rbac]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 影响面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectionImpact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/users/{guid}/roles:
    get:
      summary: 用户角色指派列表（roles.assign；{data, effective_scope} 无 total）
      description: data 为 assignment 列表（createdAt ASC）；effective_scope 为
        聚合 scope（global | device_group | none）。
      operationId: getUserRoles
      tags: [rbac]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 用户角色与聚合 scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRolesResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      summary: 全量替换用户角色指派（roles.assign；越权防护链）
      description: >-
        防护：自改角色 403（You cannot modify your own roles）；目标为保护账号
        需 super administrator（403）；给超管派非保护角色 403
        （Super administrators cannot be assigned regular roles）；
        device_group scope 仅限 device 档码（400）；device_group scope 须带 ≥1 组、
        global scope 不得带组（400）；非超管的组范围须在自己授权集内
        （403 Target device group is outside the authorized scope）。
      operationId: replaceUserRoles
      tags: [rbac]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolesRequest"
      responses:
        "200":
          description: 替换后的 {data, effective_scope}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRolesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/users/{guid}/roles/eligibility:
    get:
      summary: 角色指派资格矩阵（roles.assign；{data:[...]} 无 total）
      description: >-
        每个角色一行：eligible 与 reason_code（eligible / self_target /
        target_protected / protected_role / super_admin_target）。
      operationId: userRoleEligibility
      tags: [rbac]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 资格矩阵
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EligibilityRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  # ==================== M2 用户组域 ====================
  /api/user-groups:
    get:
      summary: 用户组列表（user_groups.view；user_count 计数）
      description: normalizedName ASC、guid ASC 决胜排序。
      operationId: listUserGroups
      tags: [user-group]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 用户组分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: 创建用户组（user_groups.create）
      description: 重名 409（User group name already exists）。
      operationId: createUserGroup
      tags: [user-group]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGroupUpsertRequest"
      responses:
        "200":
          description: 创建后的用户组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"

  /api/user-groups/{guid}:
    put:
      summary: 更新用户组（user_groups.edit）
      description: 重名 409；不存在 404 User group does not exist。
      operationId: updateUserGroup
      tags: [user-group]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGroupUpsertRequest"
      responses:
        "200":
          description: 更新后的用户组
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGroupView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: 删除用户组（user_groups.delete；默认组禁删）
      description: >-
        删除默认组 400；删除时成员回落默认组（moved_user_count），
        deleted_rule_count M2 恒 0（address_book_rules 属 M3）。
      operationId: deleteUserGroup
      tags: [user-group]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserGroupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/user-groups/{guid}/users:
    get:
      summary: 用户组成员列表（user_groups.view；search 匹配 username/email）
      description: 分页；username/display_name/email 展示。
      operationId: listUserGroupMembers
      tags: [user-group]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: LIKE 匹配 username 或 email
          schema:
            type: string
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 成员分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: 移动用户到组（user_groups.membership；body {user_guids[]}）
      description: 经 AssertUsersMutation 复核；响应 moved_user_count。
      operationId: addUserGroupMembers
      tags: [user-group]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveUsersRequest"
      responses:
        "200":
          description: 移动结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveUsersResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    CurrentParam:
      name: current
      in: query
      required: false
      description: 页码（1~100000，默认 1；camelCase 契约，禁止规范化）
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: 每页条数（1~100，默认 20；camelCase 契约，禁止规范化）
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:
    DeviceInfo:
      type: object
      properties:
        os:
          type: string
        type:
          type: string
        name:
          type: string

    LoginRequest:
      type: object
      description: type 分支请求；account 需 username/password，
        tfa_code 需 secret+tfaCode，email_code 需 secret+verificationCode。
      properties:
        type:
          type: string
          enum: [account, tfa_code, email_code, sms_code]
          default: account
        username:
          type: string
        password:
          type: string
        tfaCode:
          type: string
        secret:
          type: string
        verificationCode:
          type: string
        autoLogin:
          type: boolean
        id:
          type: string
          description: 设备 ID
        uuid:
          type: string
          description: 设备 UUID
        deviceInfo:
          $ref: "#/components/schemas/DeviceInfo"

    UserPayload:
      type: object
      description: 用户响应 payload（snake_case 契约，禁止规范化）。
      required: [guid, name, is_admin]
      properties:
        guid:
          type: string
        name:
          type: string
        display_name:
          type: string
        email:
          type: string
        note:
          type: string
        is_admin:
          type: boolean
        tfa_enabled:
          type: boolean
        has_password:
          type: boolean
        verifier:
          type: string
        third_auth_type:
          type: string
        avatar:
          type: string
        user_group_guid:
          type: string
        strategy_guid:
          type: string

    LoginResponse:
      type: object
      description: 分支结构：account 带 access_token+user；
        两步验证带 type=email_check + tfa_type + secret；
        passkey_tfa 第一步复用 email_check 类型位并附 passkey_options。
      required: [type]
      properties:
        type:
          type: string
          enum: [account, email_check]
        access_token:
          type: string
        user:
          $ref: "#/components/schemas/UserPayload"
        tfa_type:
          type: string
          enum: [tfa_check, passkey_check]
        secret:
          type: string
        passkey_options:
          type: object

    LogoutRequest:
      type: object
      properties:
        id:
          type: string
        uuid:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    SessionInfo:
      type: object
      required: [jti, createdAt, expiresAt]
      properties:
        jti:
          type: string
        deviceId:
          type: string
        deviceUuid:
          type: string
        deviceOs:
          type: string
        deviceType:
          type: string
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    PasskeyView:
      type: object
      required: [guid]
      properties:
        guid:
          type: string
        name:
          type: string
        deviceType:
          type: string
        backedUp:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OidcAuthRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
        deviceId:
          type: string
        deviceUuid:
          type: string
        deviceInfo:
          $ref: "#/components/schemas/DeviceInfo"
        frontendRedirectUrl:
          type: string

    UpdateMeRequest:
      type: object
      description: user 域请求字段为 snake_case（契约，禁止规范化）。
      properties:
        display_name:
          type: string
        email:
          type: string
          format: email
        note:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 6

    AvatarResponse:
      type: object
      required: [avatar]
      properties:
        avatar:
          type: string

    # ==================== M2 schemas ====================
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [id, uuid, ver, modified_at]
      properties:
        id:
          type: string
          description: RustDesk 数字设备 ID（如 "123456789"）
        uuid:
          type: string
          description: 设备 UUID（peers 主键）
        ver:
          type: integer
          description: 客户端整版本号（格式化规则见 info.version）
        modified_at:
          type: integer
          format: int64
          description: 客户端策略版本戳（毫秒 epoch）
        conns:
          type: array
          items:
            type: integer
          description: 当前活跃连接 ID；键缺失 ≠ 空（指针判空区分）

    HeartbeatResponse:
      type: object
      additionalProperties: false
      properties:
        disconnect:
          type: array
          items:
            type: integer
          description: 待断连 connId 列表（客户端确认语义）
        strategy:
          type: object
          required: [config_options]
          properties:
            config_options:
              type: object
              additionalProperties:
                type: string
        modified_at:
          type: integer
          format: int64
          description: 下发用策略 updatedAt（毫秒）

    SysinfoRequest:
      type: object
      additionalProperties: false
      required: [uuid]
      properties:
        uuid:
          type: string
        id:
          type: string
        hostname:
          type: string
        username:
          type: string
        os:
          type: string
        cpu:
          type: string
        memory:
          type: string
        version:
          type: string
        preset-address-book-name:
          type: string
          description: M2 接受不处理（M3 通讯录联动）
        preset-address-book-tag:
          type: string
        preset-address-book-alias:
          type: string
        preset-address-book-password:
          type: string
        preset-address-book-note:
          type: string
        preset-username:
          type: string
          description: 非空真值才覆盖 sysinfos.preset_username
        preset-strategy-name:
          type: string
        preset-device-group-name:
          type: string
          description: 按名关联 device_groups 并回写 peers.deviceGroupGuid
        preset-note:
          type: string
          description: 仅当 peers.note 为空时写入

    PeerInfo:
      type: object
      required: [device_name, username, os, version, cpu, memory, ip]
      properties:
        device_name:
          type: string
          description: sysinfos.hostname
        username:
          type: string
          description: sysinfos.username
        os:
          type: string
        version:
          type: string
          description: ver 格式化结果（ver=0 → 空串）
        cpu:
          type: string
        memory:
          type: string
        ip:
          type: string
          description: 恒为空串

    PeerView:
      type: object
      required: [id, guid, status, is_online, last_online, user, user_name, note, device_group_name, strategy_name, info]
      properties:
        id:
          type: string
          description: peer.id（数字设备 ID 字符串）
        guid:
          type: string
          description: = peer.uuid
        status:
          type: integer
          description: 1=正常 / 0=停用
        is_online:
          type: boolean
          description: lastHeartbeat > now-60s（60 秒阈值硬编码）
        last_online:
          type: string
          format: date-time
          nullable: true
        user:
          type: string
          description: = userGuid 或空串
        user_name:
          type: string
        note:
          type: string
        device_group_name:
          type: string
