        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: 删除设备组（AdminGuard 语义）
      description: >-
        被 user_role_assignment_device_groups 引用时 400
        （RESTRICT 语义由应用层计数检查实现）。
      operationId: deleteDeviceGroup
      tags: [device-group]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
