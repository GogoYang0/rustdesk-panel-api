      description: >-
        target_type=device → {uuid,id}[]（scope 过滤）；
        target_type=user → {guid,name,is_protected}[]（要求 global scope，
        非管理员只见非管理员用户）。
      operationId: strategyTargetCandidates
      tags: [strategy]
      parameters:
        - name: target_type
          in: query
