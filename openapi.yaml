      responses:
        "200":
          description: 加入结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddDevicesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/device-groups/{guid}/devices:
    delete:
      summary: 批量移出设备（AdminGuard 语义；body 为 peer.id 数字 ID 数组）
      description: 按 peers.id（数字设备 ID 字符串）匹配；返回实际移出数。
      operationId: removeDeviceGroupDevices
      tags: [device-group]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              minItems: 1
      responses:
        "200":
          description: 移出结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveDevicesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  # ==================== M2 策略域 ====================
  /api/strategies:
    get:
      summary: 策略列表（strategies.view）
      description: name LIKE 过滤；name ASC、guid ASC 决胜排序。
      operationId: listStrategies
      tags: [strategy]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 策略分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: 创建策略（strategies.create）
      description: 重名 400（Strategy name already exists）；config_options 未传存空串。
      operationId: createStrategy
      tags: [strategy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyUpsertRequest"
      responses:
        "200":
          description: 创建后的策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/strategies/candidates:
    get:
      summary: 策略候选（strategies.assign；指派界面下拉）
      description: name ASC 排序。
      operationId: strategyCandidates
      tags: [strategy]
      parameters:
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 策略候选分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyCandidatePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/strategies/target-candidates:
    get:
      summary: 指派目标候选（strategies.assign；target_type 两形态）
      description: >-
        target_type=device → {uuid,id}[]（scope 过滤）；
        target_type=user → {guid,name,is_protected}[]（要求 global scope，
        非管理员只见非管理员用户）。
      operationId: strategyTargetCandidates
      tags: [strategy]
      parameters:
        - name: target_type
          in: query
          required: true
          schema:
            type: string
            enum: [device, user]
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 目标候选分页（device/user 两形态之一）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeviceTargetPage"
                  - $ref: "#/components/schemas/UserTargetPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"

  /api/strategies/{guid}:
    get:
      summary: 策略详情（strategies.view）
      description: 含解析后的 config_options（空串解析为 {}）。
      operationId: getStrategy
      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 策略视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: 更新策略（strategies.edit）
      description: 重名 400；config_options 提供即覆盖。
      operationId: updateStrategy
      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyUpsertRequest"
      responses:
        "200":
          description: 更新后的策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: 删除策略（strategies.delete）
      description: 服务层事务显式置空 peers/users/device_groups 三处 strategyGuid 引用。
      operationId: deleteStrategy
      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除成功（空对象）
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/strategies/{guid}/assignments:
    get:
      summary: 策略当前指派目标（strategies.assign；target_type 必填）
      description: >-
        target_type=device → {uuid,id}[]（scope 过滤）；target_type=user →
        {guid,name,is_protected}[]；target_type=device_group → {guid,name}[]
        按 name ASC。
      operationId: strategyAssignments
      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
        - name: target_type
          in: query
          required: true
          schema:
            type: string
            enum: [device, user, device_group]
        - $ref: "#/components/parameters/CurrentParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: 指派目标分页（三形态之一）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DeviceTargetPage"
                  - $ref: "#/components/schemas/UserTargetPage"
                  - $ref: "#/components/schemas/DeviceGroupTargetPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/strategies/{guid}/assign:
    post:
      summary: 指派策略（strategies.assign；直写宿主表 FK）
      description: >-
        assign 语义 = 直接回写 peers/users/device_groups 的 strategyGuid 列。
        target_type=user 必须 global scope；保护账号目标需 super administrator。
        响应 {success:[], errors:[{target_guid, reason}]}；
        reason：Device not found / User does not exist / Device group not found。
      operationId: assignStrategy
      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRequest"
      responses:
        "200":
          description: 指派结果（部分成功亦 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /api/strategies/{guid}/unassign:
    post:
      summary: 解绑策略（strategies.assign；解绑 = 置 NULL）
      description: >-
        额外校验目标当前确已绑定该策略（Device is not bound to this strategy 等），
        解绑即置空宿主 FK。
      operationId: unassignStrategy
      tags: [strategy]
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRequest"
      responses:
        "200":
          description: 解绑结果（部分成功亦 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
